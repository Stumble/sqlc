# Builds wicked-sqlc for every supported platform, runs each binary on its own
# platform, and attaches the archives, checksums.txt and build provenance to the
# GitHub release of the tag. Install with scripts/install.sh.
#
# A tag push builds that tag. To add binaries to an existing release, run the
# workflow by hand with the tag (the tag's source is built, with this file's
# steps).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v2.4.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # Go release used for the binaries: the newest patch of go.mod's version.
  GO_VERSION: "1.26"

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # Linux: CGO (native PostgreSQL parser) linked statically against
          # musl in Alpine, so the binary runs on any distribution. The amd64
          # job also cross-builds Windows without CGO (WebAssembly parser).
          - { goos: linux, goarch: amd64, runner: ubuntu-24.04 }
          - { goos: linux, goarch: arm64, runner: ubuntu-24.04-arm }
          # macOS: CGO, native runners, runs on macOS 12 and later.
          - { goos: darwin, goarch: amd64, runner: macos-15-intel }
          - { goos: darwin, goarch: arm64, runner: macos-15 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Version
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "not a release tag: $TAG" >&2; exit 1; }
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          # Same version string as `make build` from the tag.
          echo "LDFLAGS=-s -w -X github.com/sqlc-dev/sqlc/internal/info.Version=${TAG}-wicked-fork" >> "$GITHUB_ENV"

      - name: Build (Linux, Alpine)
        if: matrix.goos == 'linux'
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e LDFLAGS -e GOFLAGS=-buildvcs=false -e WINDOWS="${{ matrix.goarch == 'amd64' }}" \
            "golang:${GO_VERSION}-alpine" sh -euc '
              apk add --no-cache build-base >/dev/null
              CGO_ENABLED=1 go build -trimpath \
                -ldflags="$LDFLAGS -linkmode external -extldflags -static" -o dist/sqlc ./cmd/sqlc
              if [ "$WINDOWS" = true ]; then
                CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath \
                  -ldflags="$LDFLAGS" -o dist/windows/sqlc.exe ./cmd/sqlc
              fi
              chown -R "$(stat -c %u:%g /src)" dist'
          file dist/sqlc | grep -q 'statically linked'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.goos == 'darwin'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Build (macOS)
        if: matrix.goos == 'darwin'
        env:
          CGO_ENABLED: "1"
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: go build -trimpath -ldflags="$LDFLAGS" -o dist/sqlc ./cmd/sqlc

      - name: Smoke test
        run: |
          got="$(dist/sqlc version)"
          test "$got" = "${TAG}-wicked-fork" || { echo "sqlc version = $got" >&2; exit 1; }
          cp -R internal/endtoend/testdata/wicked_compat "$RUNNER_TEMP/smoke"
          (cd "$RUNNER_TEMP/smoke" && "$GITHUB_WORKSPACE/dist/sqlc" compile && "$GITHUB_WORKSPACE/dist/sqlc" generate)

      - name: Package
        run: |
          mkdir -p out
          name="sqlc_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          cp LICENSE dist/
          tar -C dist -czf "out/${name}.tar.gz" sqlc LICENSE
          if [ -f dist/windows/sqlc.exe ]; then
            cp LICENSE dist/windows/
            (cd dist/windows && zip -q "../../out/sqlc_${VERSION}_windows_amd64.zip" sqlc.exe LICENSE)
          fi
          ls -l out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sqlc-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  windows:
    name: test windows/amd64
    needs: build
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sqlc-linux-amd64
          path: out
      - name: Smoke test
        shell: bash
        run: |
          unzip -q out/sqlc_*_windows_amd64.zip -d "$RUNNER_TEMP/bin"
          sqlc="$RUNNER_TEMP/bin/sqlc.exe"
          got="$("$sqlc" version | tr -d '\r')"
          test "$got" = "${TAG}-wicked-fork" || { echo "sqlc version = $got" >&2; exit 1; }
          cp -R internal/endtoend/testdata/wicked_compat "$RUNNER_TEMP/smoke"
          (cd "$RUNNER_TEMP/smoke" && "$sqlc" compile && "$sqlc" generate)

  publish:
    needs: [build, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # upload to the release
      id-token: write # build provenance
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sqlc-*
          path: out
          merge-multiple: true

      - name: Checksums
        working-directory: out
        run: |
          sha256sum sqlc_* > checksums.txt
          cat checksums.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/sqlc_*

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" out/* --clobber

  install:
    name: install on ${{ matrix.runner }}
    needs: publish
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    steps:
      # scripts/install.sh from this workflow's commit (an older tag may not have it).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the release with scripts/install.sh
        env:
          INSTALL_DIR: ${{ runner.temp }}/bin
        run: |
          sh scripts/install.sh "$TAG"
          got="$("$INSTALL_DIR/sqlc" version)"
          test "$got" = "${TAG}-wicked-fork" || { echo "sqlc version = $got" >&2; exit 1; }
